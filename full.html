<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客服7A训练</title>
<style>
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --text: #1d1d1f;
  --text2: #86868b;
  --text3: #aeaeb2;
  --blue: #0071e3;
  --blue2: #e8f0fe;
  --green: #34c759;
  --green2: #e8f8ed;
  --red: #ff3b30;
  --red2: #fce8e6;
  --orange: #ff9500;
  --orange2: #fff8e1;
  --radius: 14px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  display: flex; justify-content: center; align-items: center; padding: 20px;
  -webkit-font-smoothing: antialiased;
}
.container {
  max-width: 740px; width: 100%; height: calc(100vh - 40px);
  display: flex; flex-direction: column; background: var(--card);
  border-radius: 20px; box-shadow: var(--shadow); overflow: hidden;
}
.header {
  padding: 20px 24px 16px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid #f0f0f0;
}
.header h1 {
  font-size: 17px; font-weight: 600; letter-spacing: -0.2px;
  display: flex; align-items: center; gap: 8px;
}
.header h1 .badge {
  font-size: 10px; font-weight: 500; background: var(--blue2); color: var(--blue);
  padding: 2px 10px; border-radius: 20px;
}
.header-right { display: flex; align-items: center; gap: 12px; }

.btn-start {
  padding: 6px 18px; border-radius: 20px; border: none; background: var(--blue); color: #fff;
  font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity 0.2s;
}
.btn-start:hover { opacity: 0.85; }
.btn-start:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-util {
  padding: 6px 14px; border-radius: 20px; border: 1px solid #e8e8ed; background: #fff;
  font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s; color: var(--text);
}
.btn-util:hover { background: #f5f5f7; border-color: #d0d0d5; }
.btn-util:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-util.warn:hover { background: var(--red2); border-color: var(--red); color: var(--red); }

/* 加载动画 */
@keyframes dotPulse { 0%,80%,100% { opacity: 0; } 40% { opacity: 1; } }
.dot-pulse { display: inline-block; }
.dot-pulse::after {
  content: '...'; letter-spacing: 2px;
  animation: dotPulse 1.4s infinite; animation-fill-mode: both;
}

.balance-info {
  font-size: 10px; color: var(--green); font-weight: 500;
  white-space: nowrap; letter-spacing: -0.1px;
}

.balance-info { color: var(--green); }
.msg-timer-badge { display: inline-block; font-size: 11px; font-weight: 600; color: var(--text2); margin-left: 6px; padding: 0 4px; }
.msg-timer-badge.over { color: var(--red); }
.ref-em { color: #c41e1e; font-weight: 600; }

/* ===== 场景背景卡片 ===== */
.scenario-card {
  display: flex; gap: 8px; padding: 8px 12px; border-radius: 10px;
  background: linear-gradient(135deg, #e8f0fe 0%, #f0f5ff 100%);
  border: 1px solid #c8d8f0; margin-bottom: 4px;
  font-size: 13px; line-height: 1.5; align-self: stretch; max-width: 100%;
}
.scenario-card .scenario-icon { font-size: 16px; flex-shrink: 0; margin-top: 0; }
.scenario-card .scenario-title { font-weight: 600; color: #0040a0; font-size: 11px; margin-bottom: 1px; }
.scenario-card .scenario-body { color: #1d1d1f; font-size: 12px; }

/* ===== Toast 通知 ===== */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: #323232; color: #fff; padding: 8px 18px; border-radius: 10px;
  font-size: 12px; font-weight: 500; z-index: 9999;
  animation: toastIn 0.25s ease, toastOut 0.25s ease 2.8s forwards;
  max-width: 90%; text-align: center; line-height: 1.5;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateX(-50%) translateY(-4px); } }

/* ===== 设置弹窗 ===== */
.setting-group { margin-bottom: 16px; }
.setting-group label {
  display: block; font-size: 12px; font-weight: 600; color: var(--text2);
  margin-bottom: 4px; letter-spacing: -0.1px;
}
.setting-group input[type="password"],
.setting-group select {
  width: 100%; padding: 8px 12px; border: 1px solid #e8e8ed; border-radius: 10px;
  font-size: 13px; outline: none; font-family: inherit; background: #fafafa;
  transition: border-color 0.2s;
}
.setting-group input[type="password"]:focus,
.setting-group select:focus { border-color: var(--blue); background: #fff; }
.setting-group .hint { font-size: 11px; color: var(--text3); margin-top: 3px; }
.setting-group select { cursor: pointer; appearance: auto; }
.setting-mode {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.setting-mode label {
  flex: 1; padding: 8px; border-radius: 10px; border: 2px solid #e8e8ed;
  text-align: center; font-size: 12px; font-weight: 500; cursor: pointer;
  transition: all 0.15s;
}
.setting-mode input[type="radio"] { display: none; }
.setting-mode input[type="radio"]:checked + label {
  border-color: var(--blue); background: var(--blue2); color: var(--blue);
}
/* ===== 训练配置弹窗 - 苹果风 ===== */
.setup-section { margin-bottom: 16px; }
.setup-label {
  font-size: 11px; font-weight: 600; color: var(--text2);
  letter-spacing: 0.5px; margin-bottom: 6px; text-transform: uppercase;
}
.setup-cards { display: flex; gap: 8px; }
.setup-card {
  flex: 1; padding: 10px 14px; border-radius: 12px; background: #f5f5f7;
  text-align: center; font-size: 13px; font-weight: 500; cursor: pointer;
  transition: all 0.2s; color: var(--text); border: 1.5px solid transparent;
  user-select: none;
}
.setup-card:hover { background: #eaeaec; }
.setup-card.active { background: var(--blue2); border-color: var(--blue); color: var(--blue); }
.setup-card .card-icon { font-size: 18px; display: block; margin-bottom: 2px; }
.setup-card .card-label { font-size: 13px; font-weight: 600; }
.setup-card .card-desc { font-size: 10px; color: var(--text3); margin-top: 1px; }

.setup-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.setup-chip {
  padding: 5px 12px; border-radius: 20px; background: #f5f5f7;
  font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s;
  color: var(--text); border: 1.5px solid transparent; user-select: none;
}
.setup-chip:hover { background: #eaeaec; }
.setup-chip.active { background: var(--blue2); border-color: var(--blue); color: var(--blue); }
.setup-chip input { display: none; }

.setup-start {
  width: 100%; padding: 12px; border-radius: 12px; border: none;
  background: var(--blue); color: #fff; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: opacity 0.2s; letter-spacing: -0.2px;
}
.setup-start:hover { opacity: 0.85; }

.ai-status {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; padding: 2px 10px; border-radius: 12px;
  margin-left: 6px; font-weight: 500;
}
.ai-status.on { background: var(--green2); color: #1a8a3f; }
.ai-status.off { background: #f0f0f0; color: var(--text2); }

.chat-area {
  flex: 1; overflow-y: auto; padding: 20px 24px;
  display: flex; flex-direction: column; gap: 10px;
}
.chat-area:empty { display: flex; align-items: center; justify-content: center; }
.chat-area:empty::after {
  content: '点击「开始训练」随机抽取场景'; color: var(--text3); font-size: 14px; font-weight: 400;
}

.msg-group { max-width: 92%; }
.msg-group.customer { align-self: flex-start; }
.msg-group.agent { align-self: flex-end; }

.msg-bubble {
  padding: 10px 16px; border-radius: 16px; font-size: 14px; line-height: 1.6; letter-spacing: -0.1px;
}
.msg-group.customer .msg-bubble {
  background: #f0f0f0; color: var(--text); border-bottom-left-radius: 6px;
}
.msg-group.agent .msg-bubble {
  background: var(--blue2); color: var(--text); border-bottom-right-radius: 6px;
}
.msg-label { font-size: 11px; font-weight: 500; color: var(--text2); margin-bottom: 3px; }

/* 客户下方的技巧提示 - 苹果风 */
.msg-tip {
  margin-top: 3px; padding: 5px 8px; border-radius: 6px;
  background: var(--orange2); border: 1px solid #ffe8b0;
  font-size: 10px; line-height: 1.3;
}
.msg-tip .tip-row { display: flex; gap: 4px; margin-bottom: 3px; }
.msg-tip .tip-row:last-child { margin-bottom: 0; }
.msg-tip .tip-label { font-weight: 600; color: #c06c00; white-space: nowrap; }
.msg-tip .tip-val { color: #8a5700; }
.msg-tip .tip-script { color: #8a5700; font-style: italic; }

/* 客服下方的7A + 参考建议 */
.msg-feedback {
  margin-top: 3px; padding: 6px 10px; border-radius: 8px;
  background: var(--card); border: 1px solid #e8e8ed; font-size: 11px; line-height: 1.4;
}
.msg-feedback .fb-row { margin-bottom: 4px; }
.msg-feedback .fb-row:last-child { margin-bottom: 0; }
.fb-status { font-weight: 600; font-size: 11px; }
.fb-status.pass { color: var(--green); }
.fb-status.fail { color: var(--red); }
.fb-dims { display: flex; flex-wrap: wrap; gap: 3px 8px; margin-top: 2px; }
.fb-dims .dim { display: inline-flex; align-items: center; gap: 2px; padding: 1px 6px; border-radius: 4px; font-size: 11px; }
.fb-dims .dim.pass { background: var(--green2); color: #1a8a3f; }
.fb-dims .dim.fail { background: var(--red2); color: #c41e1e; }

.fb-ref { margin-top: 6px; padding-top: 6px; border-top: 1px solid #f0f0f0; display: flex; align-items: flex-start; gap: 4px; }
.fb-ref .ref-label { font-weight: 600; color: var(--blue); white-space: nowrap; font-size: 11px; }
.fb-ref .ref-text { color: var(--text2); font-size: 12px; line-height: 1.5; }

/* 输入区 */
.input-area {
  padding: 12px 20px 16px; border-top: 1px solid #f0f0f0;
  display: flex; gap: 8px; align-items: flex-end; background: var(--card);
}
.input-area textarea {
  flex: 1; border: 1px solid #e8e8ed; border-radius: 12px; padding: 10px 16px;
  font-size: 14px; resize: none; height: 44px; line-height: 1.5; outline: none;
  font-family: inherit; transition: border-color 0.2s; background: #fafafa;
}
.input-area textarea:focus { border-color: var(--blue); background: #fff; }
.input-area textarea::placeholder { color: var(--text3); }
.input-area .btn-group { display: flex; gap: 6px; }
.input-area button {
  height: 44px; padding: 0 18px; border-radius: 12px; border: none;
  font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity 0.2s;
}
.input-area button:hover { opacity: 0.85; }
.btn-send { background: var(--blue); color: #fff; }
.btn-send:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-end { background: #fff; color: var(--red); border: 1px solid #f0f0f0 !important; }
.btn-end:disabled { opacity: 0.3; cursor: not-allowed; }

/* 弹窗 */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.35);
  display: flex; align-items: center; justify-content: center; z-index: 999;
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal {
  background: #fff; border-radius: 20px; width: 92%; max-width: 520px;
  max-height: 85vh; overflow-y: auto; padding: 28px;
  animation: slideUp 0.3s ease; box-shadow: 0 12px 48px rgba(0,0,0,0.15);
}
.modal h2 { font-size: 18px; font-weight: 600; margin-bottom: 12px; letter-spacing: -0.2px; }
.result-badge {
  display: inline-block; padding: 4px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 16px;
}
.result-badge.pass { background: var(--green2); color: #1a8a3f; }
.result-badge.fail { background: var(--red2); color: #c41e1e; }
.modal-score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.modal-score-item {
  padding: 10px 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center;
}
.modal-score-item.pass { background: var(--green2); }
.modal-score-item.fail { background: var(--red2); }
.modal-score-item .name { font-size: 13px; color: var(--text); font-weight: 500; }
.modal-score-item .threshold { font-size: 10px; color: var(--text2); }
.modal-score-item .val { font-size: 18px; font-weight: 600; letter-spacing: -0.5px; }
.modal-score-item .val.pass { color: #1a8a3f; }
.modal-score-item .val.fail { color: #c41e1e; }

.modal-review h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.modal-review-item { padding: 8px 12px; border-radius: 10px; font-size: 12px; line-height: 1.6; margin-bottom: 6px; }
.modal-review-item.good { background: var(--green2); }
.modal-review-item.improve { background: var(--red2); }
.modal-review-item.tip { background: #f0f0f0; }
.modal-review-item .label { font-weight: 600; }

.modal-ref { margin-top: 12px; padding: 12px 14px; background: #fafafa; border-radius: 12px; font-size: 12px; line-height: 1.6; }
.modal-ref .ref-label { font-weight: 600; color: var(--blue); margin-bottom: 4px; }
.modal-actions { margin-top: 16px; display: flex; gap: 8px; }
.modal-actions button {
  flex: 1; padding: 10px; border-radius: 12px; border: none; font-size: 13px; font-weight: 500; cursor: pointer;
}
.modal-actions .btn-primary { background: var(--blue); color: #fff; }
.modal-actions .btn-primary:hover { opacity: 0.85; }
.modal-actions .btn-secondary { background: #f0f0f0; color: var(--text); }
.modal-actions .btn-secondary:hover { opacity: 0.85; }

.chat-area { -webkit-overflow-scrolling: touch; }
::selection { background: var(--blue2); }

/* ===== 历史记录 ===== */
.history-list-item {
  padding: 12px 16px; border-radius: 12px; background: #f9f9fb;
  margin-bottom: 8px; cursor: pointer; transition: background 0.15s;
  display: flex; justify-content: space-between; align-items: center;
}
.history-list-item:hover { background: var(--blue2); }
.history-list-item .hli-left { flex: 1; min-width: 0; }
.history-list-item .hli-cat { font-size: 11px; color: var(--blue); font-weight: 500; }
.history-list-item .hli-scene {
  font-size: 13px; color: var(--text); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.history-list-item .hli-meta { font-size: 11px; color: var(--text2); margin-top: 3px; display: flex; gap: 12px; }
.history-list-item .hli-badge {
  font-size: 11px; padding: 2px 10px; border-radius: 12px; font-weight: 500; flex-shrink: 0;
}
.history-list-item .hli-badge.pass { background: var(--green2); color: #1a8a3f; }
.history-list-item .hli-badge.fail { background: var(--red2); color: #c41e1e; }
.history-empty { text-align: center; padding: 40px 0; color: var(--text3); font-size: 14px; }

/* 详情弹窗中的对话回放 */
.detail-chat { max-height: 340px; overflow-y: auto; padding: 8px 0; margin-bottom: 12px; }
.detail-msg { margin-bottom: 8px; max-width: 96%; }
.detail-msg.customer { padding-right: 20%; }
.detail-msg.agent { padding-left: 20%; }
.detail-msg .dm-label { font-size: 10px; font-weight: 500; color: var(--text2); margin-bottom: 2px; }
.detail-msg .dm-bubble {
  padding: 8px 12px; border-radius: 12px; font-size: 12px; line-height: 1.5;
}
.detail-msg.customer .dm-bubble { background: #f0f0f0; border-bottom-left-radius: 4px; }
.detail-msg.agent .dm-bubble { background: var(--blue2); border-bottom-right-radius: 4px; }
.detail-msg.agent .dm-scores {
  display: flex; flex-wrap: wrap; gap: 2px 6px; margin-top: 3px; font-size: 10px;
}
.detail-msg.agent .dm-scores .dm-dim { padding: 1px 4px; border-radius: 3px; }
.detail-msg.agent .dm-scores .dm-dim.pass { background: var(--green2); color: #1a8a3f; }
.detail-msg.agent .dm-scores .dm-dim.fail { background: var(--red2); color: #c41e1e; }

.detail-review { margin: 8px 0; }
.detail-review-item {
  padding: 6px 10px; border-radius: 8px; font-size: 11px; line-height: 1.5; margin-bottom: 4px;
}
.detail-review-item.good { background: var(--green2); }
.detail-review-item.improve { background: var(--red2); }
.detail-review-item.tip { background: #f0f0f0; }
.detail-ref {
  margin-top: 8px; padding: 8px 12px; background: #fafafa; border-radius: 10px; font-size: 11px; line-height: 1.5;
}
.detail-ref .ref-label { font-weight: 600; color: var(--blue); margin-bottom: 2px; }

/* 清空按钮 */
.btn-clear-history {
  padding: 5px 12px; border-radius: 16px; border: 1px solid var(--red2); background: #fff;
  color: var(--red); font-size: 11px; font-weight: 500; cursor: pointer; transition: all 0.15s;
}
.btn-clear-history:hover { background: var(--red2); }
.history-header-bar {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
}
.review-loading {
  text-align: center; padding: 20px 0; color: var(--text2); font-size: 13px;
}
/* 情绪温度计 */
.emotion-bar {
  padding: 6px 20px 2px; display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid #f0f0f0;
}
.emotion-track {
  flex: 1; height: 6px; background: #f0f0f0; border-radius: 3px; overflow: hidden;
}
.emotion-fill {
  height: 100%; border-radius: 3px; background: linear-gradient(90deg, #ff3b30, #ff9500, #34c759);
  transition: width 0.5s ease;
}
.emotion-label { font-size: 11px; font-weight: 500; color: var(--text2); white-space: nowrap; }
/* 发送前预评分 */
.preview-area {
  padding: 6px 20px 0; display: flex; flex-direction: column; gap: 2px;
  border-top: 1px solid #f0f0f0; min-height: 0;
}
.preview-dims {
  display: flex; flex-wrap: wrap; gap: 2px 6px; font-size: 10px;
}
.preview-dims .pd-item {
  padding: 1px 6px; border-radius: 4px; font-weight: 500;
}
.preview-dims .pd-item.pass { background: var(--green2); color: #1a8a3f; }
.preview-dims .pd-item.fail { background: var(--red2); color: #c41e1e; }
.preview-tip { font-size: 10px; color: var(--text3); line-height: 1.4; }
/* 薄弱项按钮 */
.btn-weakness {
  width: 28px; height: 28px; border-radius: 50%; border: 1px solid #e8e8ed;
  background: #fff; font-size: 14px; cursor: pointer; display: flex;
  align-items: center; justify-content: center; transition: all 0.2s;
  line-height: 1; padding: 0;
}
.btn-weakness:hover { background: #f5f5f7; border-color: #d0d0d5; }
.btn-weakness:disabled { opacity: 0.3; cursor: not-allowed; }


@media (max-width: 520px) {
  body { padding: 0; -webkit-text-size-adjust: 100%; }
  .container { height: 100vh; border-radius: 0; }
  .container { min-height: -webkit-fill-available; }
  .modal { width: 100%; max-height: 100vh; border-radius: 0; }
  .modal { max-height: -webkit-fill-available; }
  /* 移动端 header：双行紧凑布局 */
  .header {
    padding: 10px 12px 8px; flex-wrap: wrap; gap: 4px;
    flex-direction: column; align-items: stretch;
  }
  .header h1 {
    font-size: 14px; gap: 4px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 .badge { display: none; }
  .header-right {
    display: flex; align-items: center; justify-content: flex-end;
    gap: 4px; flex-wrap: nowrap; width: 100%;
  }



  .btn-swap { font-size: 11px; padding: 3px 8px; border-radius: 14px; width: auto; height: auto; }
  .btn-start { font-size: 11px; padding: 4px 12px; white-space: nowrap; }

  .chat-area { padding: 10px 12px; }
  .input-area { padding: 8px 10px 12px; }

  .input-area textarea { font-size: 16px; height: 44px; }
  .input-area button { height: 44px; padding: 0 14px; font-size: 12px; }
  .msg-group { max-width: 96%; }
  .msg-bubble { font-size: 15px; padding: 8px 12px; }
  .emotion-bar { padding: 4px 12px 0; }
  .emotion-label { font-size: 10px; }
  .preview-area { padding: 4px 12px 0; }
  .preview-dims { font-size: 9px; }
  .msg-tip { font-size: 9px; padding: 4px 6px; }
  .msg-feedback { font-size: 10px; padding: 5px 8px; }
  /* 设置弹窗：全屏可滚动 */
  .modal { padding: 24px 16px; }
  .setup-chip { font-size: 11px; padding: 4px 10px; }
  .setup-card { padding: 8px 10px; }
  .setup-card .card-icon { font-size: 16px; }
  .setup-card .card-label { font-size: 12px; }
  .modal h2 { font-size: 16px; }
  .btn-util { font-size: 11px; padding: 3px 10px; }

const CATEGORIES = ['物流','商品','售后','反馈'];

function getCatScenes(cat) {
  const idxs = { '物流':[0,19], '商品':[20,54], '售后':[55,99], '反馈':[100,111] };
  const r = idxs[cat]; const arr = [];
  for (let i = r[0]; i <= Math.min(r[1], SCENES.length - 1); i++) arr.push(SCENES[i]);
  return arr;
}

function analyzeWeaknessFromHistory() {
  const h = getHistory();
  if (h.length < 2) return null;
  const dimTot = {}; const dimCnt = {};
  for (const d of DIM_NAMES) { dimTot[d.k] = 0; dimCnt[d.k] = 0; }
  for (const item of h) {
    for (const d of DIM_NAMES) { dimTot[d.k] += (item.scores[d.k] || 0); dimCnt[d.k]++; }
  }
  const weakDims = DIM_NAMES.filter(d => (dimTot[d.k] / dimCnt[d.k]) < THRESHOLDS[d.k]);
  const catFreq = {};
  for (const item of h) catFreq[item.cat] = (catFreq[item.cat] || 0) + 1;
  // 训练最少的分类优先推荐
  const sortedCats = CATEGORIES.sort((a, b) => (catFreq[a] || 0) - (catFreq[b] || 0));
  return { weakDims, recommendedCat: sortedCats[0] || '物流配送', catFreq, total: h.length };
}

function showTrainingSetupWithDims(dimKeys) {
  showTrainingSetup();
  // 在弹窗渲染后，取消所有维度勾选，只勾选指定的薄弱维度
  setTimeout(() => {
    const chips = document.querySelectorAll('.setup-chips');
    if (chips.length > 1) {
      const dimChips = chips[1].querySelectorAll('.setup-chip');
      const keys = dimKeys.split(',');
      for (const chip of dimChips) {
        const cb = chip.querySelector('input');
        if (cb) {
          const shouldCheck = keys.includes(cb.value);
          cb.checked = shouldCheck;
          chip.classList.toggle('active', shouldCheck);
        }
      }
    }
  }, 50);
}

function doStartTraining() {
  // 读取模式
  const modeEl = document.querySelector('input[name="trainMode"]:checked');
  const newSwap = modeEl ? modeEl.value === 'swap' : false;
  if (newSwap !== state.swapMode) toggleSwapMode();

  // 读取难度
  const diffEl = document.querySelector('input[name="trainDiff"]:checked');
  const newDiff = diffEl ? diffEl.value : 'hard';
  if (newDiff !== state.difficulty) {
    state.difficulty = newDiff;
    localStorage.setItem('csDifficulty', newDiff);
  }

  // 读取分类
  const chipGroups = document.querySelectorAll('.setup-chips');
  const catChecks = chipGroups[0] ? chipGroups[0].querySelectorAll('input:checked') : [];
  let cats = [];
  for (const c of catChecks) cats.push(c.value);
  if (cats.length === 0 || cats.length === CATEGORIES.length) cats = null;

  // 读取重点训练维度
  const dimChecks = chipGroups[1] ? chipGroups[1].querySelectorAll('input:checked') : [];
  const focusDims = [];
  for (const cb of dimChecks) focusDims.push(cb.value);

  // 读取连续训练
  const contEl = document.querySelector('input[name="continuous"]:checked');
  const contVal = contEl ? parseInt(contEl.value) : 1;
  state.continuousTotal = contVal > 1 ? contVal : 0;
  state.continuousRound = 0;

  closeModal();
  startSession(cats, focusDims);
}

async function startSession(catFilter, focusDims) {
  state.focusDims = focusDims || [];
  if (state.continuousTotal > 0 && state.continuousRound === 0) state.continuousRound = 1;
  // 按分类筛选场景
  let pool = []; // { scene, cat }
  if (catFilter) {
    for (const c of catFilter) {
      for (const s of getCatScenes(c)) pool.push({ scene: s, cat: c });
    }
  } else {
    for (let i = 0; i < SCENES.length; i++) pool.push({ scene: SCENES[i], cat: guessCat(i) });
  }
  const pick = pool[Math.floor(Math.random() * pool.length)];
  state.scene = pick.scene;
  state.cat = pick.cat;
  state.msgs = []; state.round = 0; state.heat = 0;
  state.active = true; state.ended = false;
  timerSec = 0; stopTimer();
  state.acc = { serviceAttitude: [], emotionMgmt: [], commAbility: [], responseSpeed: [], bizAbility: [], problemSolved: [], userSatisfied: [] };
  state.satisfactions = [];
  document.getElementById('chatArea').innerHTML = '';
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnHistory').disabled = true;
  document.getElementById('btnSend').disabled = true;
  document.getElementById('btnEnd').disabled = true;
  const inp = document.getElementById('agentInput'); inp.disabled = true;
  inp.placeholder = '输入回复…';

  // AI 模式：生成场景详情 + 客户开场白
  if (isAiMode()) {
    setLoading(true);
    state.scenarioDetail = await asyncGenerateScenario(state.scene, state.cat);
    setLoading(false);

    // 显示场景背景卡片
    const area = document.getElementById('chatArea');
    const card = document.createElement('div');
    card.className = 'scenario-card';
    const isFeedback = state.cat === '反馈';
    const warnStyle = isFeedback ? 'style="color:var(--red);font-weight:700;"' : '';
    const bodyPrefix = isFeedback ? '<span style="color:var(--red);font-weight:700;">【反馈场景】</span> ' : '';
    card.innerHTML = `<div class="scenario-icon">${isFeedback ? '⚠️' : '📋'}</div><div><div class="scenario-title" ${warnStyle}>${state.cat}场景${isFeedback ? ' ★' : ''}</div><div class="scenario-body">${bodyPrefix}${state.scenarioDetail}</div></div>`;
    area.appendChild(card);

    if (state.swapMode) {
      // 互换模式：提示用户以客户身份输入
      const tip = document.createElement('div');
      tip.className = 'scenario-card';
      tip.style.cssText = 'background:var(--orange2);border-color:#ffe8b0;';
      tip.innerHTML = `<div class="scenario-icon">🗣️</div><div><div class="scenario-title" style="color:#c06c00;">角色互换模式</div><div class="scenario-body" style="color:#8a5700;">请以客户身份输入你的投诉或问题，AI 将扮演客服回复你。</div></div>`;
      document.getElementById('chatArea').appendChild(tip);
      document.getElementById('btnSend').disabled = false;
      document.getElementById('btnEnd').disabled = false;
      inp.disabled = false; inp.focus();
      inp.placeholder = '输入客户投诉…';
    } else {
      // 常规 AI 模式：生成客户第一句话
      setLoading(true);
      const firstMsg = await asyncGenCust('', true);
      setLoading(false);
      addMsg('customer', firstMsg);
      document.getElementById('btnSend').disabled = false;
      document.getElementById('btnEnd').disabled = false;
      inp.disabled = false; inp.focus();
    }
  } else {
    state.scenarioDetail = '';
    document.getElementById('btnSend').disabled = false;
    document.getElementById('btnEnd').disabled = false;
    inp.disabled = false; inp.focus();
    addMsg('customer', state.scene);
  }
  startTimer();
}

function guessCatByScene(idx, catPool) {
  // 如果知道场景属于哪个分类池，直接返回第一个（用于筛选场景）
  if (catPool && catPool.length === 1) return catPool[0];
  // 通过场景文本反查
  const scene = SCENES[idx];
  return guessCat(SCENES.indexOf(scene));
}

function guessCat(i) {
  if (i < 20) return '物流配送'; if (i < 35) return '商品破损';
  if (i < 55) return '商品质量'; if (i < 70) return '退换货';
  if (i < 85) return '安装使用'; if (i < 100) return '价格活动';
  return '反馈';
}

// ============ 回复计时器 ============
let timerSec = 0, timerId = null, timerBadgeEl = null;
function startTimer() {
  clearInterval(timerId); timerSec = 0;
  const msgs = document.querySelectorAll('.msg-group.customer');
  const last = msgs[msgs.length - 1];
  if (!last) return;
  let badge = last.querySelector('.msg-timer-badge');
  if (!badge) { badge = document.createElement('span'); badge.className = 'msg-timer-badge'; var bubble = last.querySelector('.msg-bubble'); if(bubble) bubble.appendChild(badge); }
  timerBadgeEl = badge; if(badge) badge.textContent = '0s'; if(badge) badge.classList.remove('over');
  updateTimer();
  timerId = setInterval(() => { timerSec++; updateTimer(); }, 1000);
}
function stopTimer() { clearInterval(timerId); if (timerBadgeEl) { timerBadgeEl.textContent = ''; timerBadgeEl = null; } }
function updateTimer() { if (timerBadgeEl) { timerBadgeEl.textContent = timerSec + 's'; timerBadgeEl.classList.toggle('over', timerSec > 30); } }

function addMsg(role, text, scores) {
  const area = document.getElementById('chatArea');
  // 互换模式下左右对调：用户消息始终靠右，AI消息始终靠左
  const displayRole = (state.swapMode && role === 'customer') ? 'agent' : (state.swapMode && role === 'agent') ? 'customer' : role;
  const g = document.createElement('div'); g.className = `msg-group ${displayRole}`;
  let lbl;
  if (state.swapMode) {
    lbl = role === 'customer' ? '🗣️ 客户发言' : '📞 客服回复';
  } else {
    lbl = role === 'customer' ? '客户' : '我的回复';
  }
  let h = `<div class="msg-bubble"><div class="msg-label">${lbl}</div>${text}</div>`;
  g.innerHTML = h;
  area.appendChild(g);

  // 互换模式下不显示客户消息分析（那是用户自己发的）
  if (role === 'customer' && !state.swapMode) {
    if (isAiMode()) {
      // AI 模式：先显示加载，再异步生成分析
      const d = document.createElement('div'); d.className = 'msg-tip';
      d.innerHTML = `<div class="tip-row" style="justify-content:center;"><span style="font-size:11px;color:var(--text3);">🤔 分析客户消息中…</span></div>`;
      g.appendChild(d);
      area.scrollTop = area.scrollHeight;
      asyncGetTip(text).then(tip => {
        d.innerHTML = `
          <div class="tip-row"><span class="tip-label">😤 情绪</span><span class="tip-val">${tip.emotion || '—'}</span></div>
          <div class="tip-row"><span class="tip-label">🎯 诉求</span><span class="tip-val">${tip.need || '—'}</span></div>
          <div class="tip-row"><span class="tip-label">💡 技巧</span><span class="tip-val">${tip.method || '—'}</span></div>
          <div class="tip-row"><span class="tip-label">📝 参考</span><span class="tip-script">「${tip.script || '—'}」</span></div>`;
      }).catch(() => {
        const t = getTip();
        d.innerHTML = `<div class="tip-row"><span class="tip-label">要点</span><span class="tip-val">${t.key}</span></div><div class="tip-row"><span class="tip-label">技巧</span><span class="tip-val">${t.method}</span></div><div class="tip-row"><span class="tip-label">参考</span><span class="tip-script">「${t.script}」</span></div>`;
      });
    } else {
      const t = getTip();
      const d = document.createElement('div'); d.className = 'msg-tip';
      d.innerHTML = `<div class="tip-row"><span class="tip-label">要点</span><span class="tip-val">${t.key}</span></div><div class="tip-row"><span class="tip-label">技巧</span><span class="tip-val">${t.method}</span></div><div class="tip-row"><span class="tip-label">参考</span><span class="tip-script">「${t.script}」</span></div>`;
      g.appendChild(d);
    }
  }

  if (role === 'agent' && scores) {
    const fb = document.createElement('div'); fb.className = 'msg-feedback';
    let allPass = true;
    let dm = '';
    for (const d of DIM_NAMES) {
      const s = scores[d.k] || 0; const t = THRESHOLDS[d.k]; const p = s >= t;
      if (!p) allPass = false;
      dm += `<span class="dim ${p ? 'pass' : 'fail'}">${p ? '✅' : '❌'} ${d.n}${s}</span>`;
    }
    // 本地模式生成基于评分的改进建议
    const failDims = [];
    const dimTips = { serviceAttitude:'多用礼貌用语「亲亲」「抱歉」「谢谢」', emotionMgmt:'先共情再给方案，用「确实让您…了」句式', commAbility:'结尾加「您看行吗」引导确认', responseSpeed:'给具体时效承诺', bizAbility:'方案要准确具体', problemSolved:'主动推动解决', userSatisfied:'确认客户接受方案' };
    for (const d of DIM_NAMES) { if (scores[d.k] < THRESHOLDS[d.k]) failDims.push(dimTips[d.k] || '加强训练'); }
    const localRef = failDims.length > 0 ? failDims.map(t => '🔧 ' + t).join(' ') : '✅ 全部达标';
    const refId = 'ref_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
    fb.innerHTML = `<div class="fb-row"><span class="fb-status ${allPass ? 'pass' : 'fail'}">${allPass ? '✅ 全部达标' : '⚠️ 有未达标'}</span></div><div class="fb-row fb-dims">${dm}</div><div class="fb-ref" id="${refId}"><span class="ref-label">💡 改进建议</span><span class="ref-text">${failDims.length === 0 ? '✅ 所有维度均已达标，继续保持！🎉' : localRef}</span></div>`;
    g.appendChild(fb);

    // AI模式：异步生成更精准的参考话术
    if (isAiMode() && text) {
      asyncGenReference(text, scores).then(aiRef => {
        const el = document.getElementById(refId);
        if (el) el.innerHTML = `<span class="ref-label">💡 改进建议</span><span class="ref-text">${aiRef}</span>`;
      }).catch(() => {});
    }
  }

  area.scrollTop = area.scrollHeight;
  state.msgs.push({ role, text });
}

function getTip() {
  const cat = state.cat || '物流配送';
  const techs = TECHNIQUES[cat] || [{ label: '共情先行', script: '确实让您…了，这事儿换谁…' }];
  const p = techs[Math.floor(Math.random() * techs.length)];
  const km = {
    '物流配送': '客户在催物流，先共情→给时效→主动补偿',
    '商品破损': '客户收到破损，先道歉→给方案→运费兜底',
    '商品质量': '客户质疑商品，先接情绪→引导凭证→给方案',
    '退换货': '客户想退货，直接代客操作最省事',
    '安装使用': '客户遇到使用问题，给具体解决路径',
    '价格活动': '客户对价格不满，先理解不辩解再核实'
  };
  return { key: km[cat] || '先共情再给方案', method: p.label, script: p.script };
}

let loadingTimer = null;
function setLoading(show) {
  const area = document.getElementById('chatArea');
  const existing = document.getElementById('loadingIndicator');
  if (existing) { existing.remove(); clearTimeout(loadingTimer); }
  if (!show) return;
  const div = document.createElement('div');
  div.id = 'loadingIndicator';
  div.className = 'msg-group customer';
  div.innerHTML = `<div class="msg-bubble" style="background:#f0f0f0;opacity:0.7;"><div class="msg-label" style="font-size:11px;">🤔 思考中…</div><div style="font-size:13px;display:flex;gap:4px;"><span class="dot-pulse"></span></div></div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  loadingTimer = setTimeout(() => {
    const el = document.getElementById('loadingIndicator');
    if (el) el.remove();
    if (state.active) document.getElementById('btnSend').disabled = false;
  }, 30000);
}

async function sendReply() {
  if (!state.active || state.ended) return;
  const inp = document.getElementById('agentInput');
  const t = inp.value.trim();
  if (!t) return;
  if (t === '结束' || t === 'end') { inp.value = ''; endSession(); return; }
  inp.value = '';
  stopTimer();

  // 禁用按钮防重复提交
  document.getElementById('btnSend').disabled = true;

  // 角色互换模式
  if (state.swapMode) {
    // 用户输入作为客户消息
    addMsg('customer', t);
    state.round++;
    state.heat = Math.min(state.round, 5);

    // 生成客服回复（AI或本地）
    let agentReply, scores;
    if (isAiMode()) {
      setLoading(true);
      agentReply = await asyncGenAgentReply(t);
      setLoading(false);
      setLoading(true);
      scores = await asyncEvalReply(agentReply);
      setLoading(false);
    } else {
      agentReply = '亲亲抱歉让您久等了，我马上帮您核实处理，您看行吗？';
      scores = evalReply(agentReply);
    }

    // 存评分 + 展示
    for (const k of DIM_NAMES.map(d => d.k)) state.acc[k].push(scores[k]);
    if (scores.satisfaction) state.satisfactions.push(scores.satisfaction);
    addMsg('agent', agentReply, scores);
    updateEmotionBar(scores.satisfaction || '一般');
    startTimer();

    document.getElementById('btnSend').disabled = false;
    document.getElementById('agentInput').focus();
    return;
  }

  // 评分（AI 或本地）
  let scores;
  if (isAiMode()) {
    setLoading(true);
    scores = await asyncEvalReply(t);
    setLoading(false);
  } else {
    scores = evalReply(t);
  }

  // 评分维度入 acc，满意度单独存
  for (const k of DIM_NAMES.map(d => d.k)) state.acc[k].push(scores[k]);
  if (scores.satisfaction) state.satisfactions.push(scores.satisfaction);
  addMsg('agent', t, scores);
  updateEmotionBar(scores.satisfaction || '一般');
  state.round++;
  state.heat = Math.min(state.round, 5);

  // 客户回复（AI 或本地）
  const delay = isAiMode() ? 200 : (400 + Math.random() * 500);
  setTimeout(async () => {
    if (!state.active || state.ended) { document.getElementById('btnSend').disabled = false; return; }
    let r;
    if (isAiMode()) {
      setLoading(true);
      r = await asyncGenCust(t, false, scores);
      setLoading(false);
    } else {
      r = genCust();
    }
    addMsg('customer', r);
    startTimer();
    document.getElementById('btnSend').disabled = false;
    document.getElementById('agentInput').focus();
  }, delay);
}

function genCust() {
  const aw = Math.min(0.7, 0.3 + state.heat * 0.08);
  const qw = 0.25; const cw = 1 - aw - qw;
  const r = Math.random();
  let pool = r < aw ? CUSTOMER_REPLIES.angry : r < aw + qw ? CUSTOMER_REPLIES.question : CUSTOMER_REPLIES.calm;
  const last = state.msgs.length >= 2 ? state.msgs[state.msgs.length - 1].text : '';
  let c, att = 0;
  do { c = pool[Math.floor(Math.random() * pool.length)]; att++; } while (c === last && att < 10);
  return c;
}

function evalReply(t) {
  const sa = Math.min(10, Math.round(5 +
    (/亲亲|您好|亲/.test(t) ? 1 : 0) + (/您|请|抱歉|谢谢|辛苦/.test(t) ? 1 : 0) +
    (/您看|您放心|我来帮/.test(t) ? 1 : 0) + (/是我们的问题|给您添麻烦|让您/.test(t) ? 1 : 0) +
    (/不让您|帮您处理好|为您负责|帮您跟进/.test(t) ? 1 : 0) + (/您看成吗|您看行吗/.test(t) ? 0.5 : 0)));
  const em = Math.min(10, Math.round(5 +
    (/确实让您|理解您|完全理解/.test(t) ? 1.5 : 0) + (/这事儿换谁|换做是我|换我我也/.test(t) ? 1 : 0) +
    (/生气|着急|失望|担心|烦心|郁闷|窝火|心疼|不痛快|不舒服/.test(t) ? 1 : 0) +
    (/我先跟您道个歉|给您道歉/.test(t) ? 1 : 0) + (/您别急|您消消气|您别担心/.test(t) ? 0.5 : 0) + (/心里/.test(t) ? 0.5 : 0)));
  const ca = Math.min(10, Math.max(1, Math.round(5 +
    (t.length >= 20 && t.length <= 120 ? 1 : 0) + (t.length > 120 ? 0.5 : 0) +
    (!/亲亲.*亲亲.*亲亲/.test(t) && (t.split('呢').length - 1) <= 3 ? 0.5 : 0) +
    (/您看成吗|您看可以吗|可以吗|行吗/.test(t) ? 0.5 : 0) + (/您方便|辛苦您|麻烦您/.test(t) ? 0.5 : 0) +
    (/①|②|③|首先|其次|方案/.test(t) ? 0.5 : 0) - (/您的反馈很重要|已为您记录/.test(t) ? 1 : 0))));
  const ba = Math.min(10, Math.round(5 +
    (/核实|查询|查看|确认/.test(t) ? 0.5 : 0) + (/退货|退款|换货|补发|重拍/.test(t) ? 1 : 0) +
    (/运费我们出|运费我们承担|我们出运费/.test(t) ? 1 : 0) + (/晚到必赔|体验补偿|体验保障/.test(t) ? 0.5 : 0) +
    (/上门取件/.test(t) ? 0.5 : 0) + (/帮您申请|帮您争取/.test(t) ? 1 : 0) +
    (/方案|选项/.test(t) ? 0.5 : 0) + (/抱歉|对不起|我们的问题/.test(t) ? 0.5 : 0)));
  const ps = Math.min(10, Math.round(5 +
    (/帮您|我来|我直接/.test(t) ? 1 : 0) + (/方案|您看|处理|解决/.test(t) ? 1 : 0) +
    (/①|②|③|选项/.test(t) ? 1 : 0) + (/预计|小时|天内|明天|今天/.test(t) ? 0.5 : 0) +
    (/您看成吗|您看行吗|可以吗|行吗/.test(t) ? 0.5 : 0) + (/我帮您处理|我来处理|帮您解决好/.test(t) ? 0.5 : 0)));
  const us = Math.min(10, Math.round(5 +
    (/您看行吗|您看成吗|可以吗|行吗/.test(t) ? 1.5 : 0) + (/您觉得|您说呢|您更偏向/.test(t) ? 1 : 0) +
    (/还有其他可以帮您的吗|还有其他问题/.test(t) ? 1 : 0) + (/祝您|开心|好运/.test(t) ? 0.5 : 0) + (/感谢您|谢谢您/.test(t) ? 0.5 : 0)));
  const avgScore = Math.round((sa + em + ca + 7 + ba + ps + us) / 7);
  let satisfaction;
  if (avgScore >= 8) satisfaction = '很满意';
  else if (avgScore >= 6) satisfaction = '满意';
  else if (avgScore >= 4) satisfaction = '一般';
  else satisfaction = '不满意';
  return { serviceAttitude: sa, emotionMgmt: em, commAbility: ca, responseSpeed: 7, bizAbility: ba, problemSolved: ps, userSatisfied: us, satisfaction };
}

// 查询账户余额（DeepSeek/Mimo）
async function fetchBalance() {
  const el = document.getElementById('balanceDisplay');
  if (!el || !AI_CONFIG.apiKey) { if (el) el.textContent = ''; return; }
  // 每小时刷新一次
  if (BALANCE_CACHE.balance !== null && BALANCE_CACHE.updated && Date.now() - BALANCE_CACHE.updated < 3600000) {
    el.textContent = BALANCE_CACHE.balance;
    return BALANCE_CACHE.balance;
  }
  el.classList.add('loading');
  el.textContent = '⟳';
  try {
    let balUrl, res;
    if (AI_CONFIG.provider === 'mimo') {
      balUrl = getBaseUrl().replace('/v1','') + '/user/balance';
      try { res = await fetch(balUrl, { headers: { 'Authorization': 'Bearer ' + AI_CONFIG.apiKey } }); if (!res.ok) throw new Error(); }
      catch { balUrl = getBaseUrl() + '/dashboard/billing/credit_grants'; res = await fetch(balUrl, { headers: { 'Authorization': 'Bearer ' + AI_CONFIG.apiKey } }); }
    } else {
      balUrl = getBaseUrl() + '/user/balance';
      res = await fetch(balUrl, { headers: { 'Authorization': 'Bearer ' + AI_CONFIG.apiKey } });
    }
    if (!res.ok) throw new Error('余额查询失败');
    const data = await res.json();
    let bal = '-';
    if (data.balance_infos && data.balance_infos.length > 0) {
      const bi = data.balance_infos[0];
      bal = '¥' + parseFloat(bi.total_balance).toFixed(2);
    } else if (data.balance !== undefined) {
      bal = '¥' + parseFloat(data.balance).toFixed(2);
    } else if (data.data && data.data.balance !== undefined) {
      bal = '¥' + parseFloat(data.data.balance).toFixed(2);
    } else if (data.total_grants !== undefined) {
      bal = '¥' + parseFloat(data.total_grants).toFixed(2);
    } else if (data.total_used !== undefined) {
      const remain = (data.total_grants || 0) - data.total_used;
      bal = '¥' + parseFloat(remain).toFixed(2);
    }
    BALANCE_CACHE.balance = bal;
    BALANCE_CACHE.updated = Date.now();
    const prefix = AI_CONFIG.provider === 'mimo' ? '小米' : 'DS';
    el.textContent = prefix + ' ' + bal;
    el.classList.remove('loading');
    return bal;
  } catch (e) {
    console.warn('余额查询失败:', e.message);
    const prefix = AI_CONFIG.provider === 'mimo' ? '小米' : 'DS';
    el.textContent = prefix + ' --';
    el.classList.remove('loading');
    return null;
  }
}

// 改造 callDeepSeek：统一 system prompt + 解析 usage + 追踪 token
async function callDeepSeek(roleTag, userMsg, temperature = 0.7, opts = {}) {
  if (!AI_CONFIG.apiKey) throw new Error('API Key 未配置');
  const fullMsg = '【角色：' + roleTag + '】\n' + userMsg;
  // 根据角色选择系统提示：轻量/完整（含规则）
  const heavyRoles = ['评分评估', '客服回复生成'];
  const system = heavyRoles.includes(roleTag) ? AI_SYSTEM_FULL : AI_SYSTEM_LIGHT;
  const controller = new AbortController();
  const timeoutMs = opts.timeout || (AI_CONFIG.provider === 'mimo' ? 15000 : 25000);
  const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
  const maxTk = opts.maxTokens || 512;
  const res = await fetch(getBaseUrl() + '/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + AI_CONFIG.apiKey },
    body: JSON.stringify({
      model: getModelName(),
      messages: [
        { role: 'system', content: system },
        { role: 'user', content: fullMsg }
      ],
      temperature: temperature,
      max_tokens: maxTk
    }),
    signal: controller.signal
  });
  clearTimeout(timeoutId);
  if (!res.ok) {
    let msg = 'API 请求失败';
    try { const err = await res.json(); msg = err.error?.message || msg; } catch {}
    throw new Error(msg + ' (' + res.status + ')');
  }
  const data = await res.json();
  const content = data.choices[0].message.content.trim();

  // 解析 usage
  const u = data.usage || {};
  const promptTk = u.prompt_tokens || 0;
  const completionTk = u.completion_tokens || 0;
  const cachedTk = u.prompt_cache_hit_tokens || 0;
  const totalTk = u.total_tokens || (promptTk + completionTk);

  TOKEN_USAGE.prompt += promptTk;
  TOKEN_USAGE.completion += completionTk;
  TOKEN_USAGE.cached += cachedTk;
  TOKEN_USAGE.total += totalTk;
  TOKEN_USAGE.calls++;
  updateTokenDisplay();

  return { content, usage: { prompt: promptTk, completion: completionTk, cached: cachedTk, total: totalTk } };
}

      else if (line.includes('参考') || line.includes('话术')) result.script = line.replace(/^.*?[：:]\s*/, '');
    }
    return result;
  } catch (e) {
    console.warn('AI 消息分析失败，使用本地规则：', e.message);

8. satisfaction（客户满意度）- 评估客户对这次回复的感受：很满意 / 满意 / 一般 / 不满意

${state.cat === '反馈' ? '注意：此场景为反馈场景，客服无法直接解决问题时需转交售后团队，承诺48小时内回复。评估客服是否做到：1.共情安抚 2.告知反馈流程 3.承诺48小时时效 4.让客户放心。\n' : ''}本次训练重点提升维度：${(state.focusDims && state.focusDims.length) ? state.focusDims.map(k => DIM_NAMES.find(d => d.k === k)?.n).filter(Boolean).join('、') : '全部'}

评分尺度：
9-10 = 出色标杆，7-8 = 良好达标，5-6 = 及格有提升空间，1-4 = 需大幅改进
当前难度：${state.difficulty === 'easy' ? '简单模式——评分可适当宽松，客户较好说话' : state.difficulty === 'hard' ? '困难模式——评分严格，客户非常难缠，标准相应提高' : state.difficulty === 'extreme' ? '特难模式——评分极为严格，客户恶意找茬，标准大幅提高' : '中等模式——正常评分标准'}

请返回严格JSON格式，不要包含其他文字：
{"scores":{"serviceAttitude":7,"emotionMgmt":6,"commAbility":6,"responseSpeed":7,"bizAbility":6,"problemSolved":6,"userSatisfied":6},"satisfaction":"满意","strengths":["..."],"improvements":["..."]}`;

  try {
    const res = await callDeepSeek('评分评估', prompt, 0.3, {maxTokens:400});
    const raw = res.content;
    // 尝试提取 JSON（模型可能额外输出文字包裹）
    const jsonMatch = raw.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('无法解析 AI 评分结果');
    const parsed = JSON.parse(jsonMatch[0]);
    const s = parsed.scores || parsed;
    const sat = parsed.satisfaction || (s.satisfaction || '一般');
    // 确保满意度值是合法的
    const validSat = SAT_LEVELS.includes(sat) ? sat : '一般';
    return {
      serviceAttitude: clamp(s.serviceAttitude),
      emotionMgmt: clamp(s.emotionMgmt),
      commAbility: clamp(s.commAbility),
      responseSpeed: clamp(s.responseSpeed),
      bizAbility: clamp(s.bizAbility),
      problemSolved: clamp(s.problemSolved),
      userSatisfied: clamp(s.userSatisfied),
      satisfaction: validSat
    };
  } catch (e) {
    console.warn('AI 评分失败，降级到本地：', e.message);
    showToast('⚠️ AI 评分降级到本地规则');

function doPreview(text) {
  const area = document.getElementById('previewArea');
  const dims = document.getElementById('previewDims');
  const tip = document.getElementById('previewTip');
  if (!area || !dims || !tip) return;
  area.style.display = 'flex';
  const s = evalReply(text);
  let html = '';
  const keys = ['serviceAttitude','emotionMgmt','commAbility','responseSpeed','bizAbility','problemSolved','userSatisfied'];
  const names = { serviceAttitude:'态度', emotionMgmt:'情绪', commAbility:'沟通', responseSpeed:'响应', bizAbility:'业务', problemSolved:'解决', userSatisfied:'满意' };
  let failCount = 0;
  for (const k of keys) {
    const v = s[k] || 0; const t = THRESHOLDS[k]; const p = v >= t;
    if (!p) failCount++;
    html += `<span class="pd-item ${p ? 'pass' : 'fail'}">${names[k]}${v}/${t}</span>`;
  }
  dims.innerHTML = html;
  const tips = [];
  if (failCount > 0) tips.push('发送后 AI 将给出详细评分和优化建议');
  if (!/您看行吗|您看成吗|可以吗/.test(text)) tips.push('结尾加「您看行吗」引导确认');
  if (!/抱歉|对不起|不好意思/.test(text) && state.heat > 2) tips.push('客户情绪较高，建议先道歉再给方案');
  if (!/帮您|我来|我直接/.test(text)) tips.push('多用「帮您」「我来」体现主动服务');
  tip.textContent = tips.length > 0 ? '💡 ' + tips[0] : '✅ 基础要素齐全';
}

function showDashboard() {
  const history = getHistory();
  if (history.length === 0) {
    showToast('暂无训练数据，完成训练后自动生成');
    return;
  }
  // 统计周期
  const today = new Date(); today.setHours(0,0,0,0);
  const weekAgo = today.getTime() - 7*86400000;
  let todayCount = 0, weekCount = 0;
  const dimTotals = {}; const dimCounts = {};
  for (const d of DIM_NAMES) { dimTotals[d.k] = 0; dimCounts[d.k] = 0; }

  // 分前半/后半计算趋势
  const mid = Math.floor(history.length / 2);
  const laterTotals = {}; const laterCounts = {};
  for (const d of DIM_NAMES) { laterTotals[d.k] = 0; laterCounts[d.k] = 0; }

  for (let idx = 0; idx < history.length; idx++) {
    const h = history[idx];
    const t = h.id || 0;
    if (t >= today.getTime()) todayCount++;
    if (t >= weekAgo) weekCount++;
    for (const d of DIM_NAMES) {
      dimTotals[d.k] += (h.scores[d.k] || 0);
      dimCounts[d.k]++;
    }
    if (idx >= mid) {
      for (const d of DIM_NAMES) {
        laterTotals[d.k] += (h.scores[d.k] || 0);
        laterCounts[d.k]++;
      }
    }
  }

  // 维度平均分 + 分析薄弱项 + 趋势箭头
  let dimHtml = '';
  const weakDims = [];
  for (const d of DIM_NAMES) {
    const avg = dimCounts[d.k] > 0 ? (dimTotals[d.k] / dimCounts[d.k]).toFixed(1) : '—';
    const pass = parseFloat(avg) >= THRESHOLDS[d.k];
    const barW = Math.min(100, Math.round((parseFloat(avg) / 10) * 100));
    if (!pass && dimCounts[d.k] > 0) weakDims.push({ name: d.n, key: d.k, avg: parseFloat(avg), threshold: THRESHOLDS[d.k] });
    // 趋势箭头
    let trend = '';
    if (laterCounts[d.k] > 0 && dimCounts[d.k] > 0) {
      const earlierAvg = (dimTotals[d.k] - laterTotals[d.k]) / (dimCounts[d.k] - laterCounts[d.k]);
      const laterAvg = laterTotals[d.k] / laterCounts[d.k];
      const diff = laterAvg - earlierAvg;
      if (diff > 0.2) trend = '<span style="color:#34c759;font-size:10px;"> ↑' + diff.toFixed(1) + '</span>';
      else if (diff < -0.2) trend = '<span style="color:#ff3b30;font-size:10px;"> ↓' + Math.abs(diff).toFixed(1) + '</span>';
      else trend = '<span style="color:#86868b;font-size:10px;"> →</span>';
    }
    dimHtml += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:12px;">
      <span style="width:56px;text-align:right;color:var(--text2);">${d.n}</span>
      <div style="flex:1;height:10px;background:#f0f0f0;border-radius:5px;overflow:hidden;">
        <div style="height:100%;width:${barW}%;background:${pass ? '#34c759' : '#ff3b30'};border-radius:5px;"></div>
      </div>
      <span style="width:40px;font-weight:600;color:${pass ? '#1a8a3f' : '#c41e1e'};">${avg}</span>
      <span style="font-size:10px;color:var(--text3);">/${d.threshold}</span>
      ${trend}
    </div>`;
  }

  // 改进建议
  let insightHtml = '';
  if (weakDims.length > 0) {
    const tips = {
      '服务态度': '多用「亲亲」「您好」「抱歉」「谢谢」等礼貌用语，首句先接情绪再处理问题',
      '情绪管理': '先共情再给方案，使用「确实让您…了」「这事儿换谁心里都不舒服」句式',
      '沟通能力': '表达要清晰有条理，给出1-2-3步骤，结尾加「您看行吗」引导确认',
      '响应速度': '第一时间回应客户，即使需要查询也给具体时效承诺「X分钟内回复您」',
      '业务能力': '熟悉售后规则，给出准确具体的方案，不确定时先核实再回复',
      '问题解决': '主动推动问题解决，提供可操作的方案，不要停留在口头抱歉',
      '用户满意': '每轮结尾必须加引导确认「您看行吗」「您看成吗」，确认客户接受方案'
    };
    const weakKeys = weakDims.map(d => d.key);
    const tipItems = weakDims.map(d => {
      const t = tips[d.name] || '建议针对性加强训练';
      return `<div style="display:flex;gap:6px;margin-bottom:4px;font-size:11px;">
        <span style="color:#c41e1e;flex-shrink:0;">🔧</span>
        <span style="color:var(--text2);">${d.name}：${t}</span>
      </div>`;
    }).join('');
    insightHtml = `
      <div style="margin-top:12px;padding:10px 12px;background:#fff8e1;border-radius:10px;">
        <div style="font-size:12px;font-weight:600;color:#c06c00;margin-bottom:4px;">🎯 需要加强（${weakDims.length}项）</div>
        ${tipItems}
        <div style="margin-top:6px;display:flex;gap:6px;">
          <button style="flex:1;padding:8px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-size:13px;font-weight:500;cursor:pointer;" onclick="closeModal();showTrainingSetupWithDims('${weakKeys.join(',')}')">🚀 专项训练</button>
        </div>

  } else {
    insightHtml = `

        <div style="font-size:12px;font-weight:600;color:#1a8a3f;">🎉 所有维度均已达标</div>

  document.getElementById('modalContainer').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2>📊 数据看板</h2>

        <div style="display:flex;gap:8px;margin-bottom:14px;">
          <div style="flex:1;text-align:center;padding:10px;background:#f5f5f7;border-radius:10px;">
            <div style="font-size:22px;font-weight:700;">${todayCount}</div>

          </div>

function showWeakness() {
  const history = getHistory();
  if (history.length < 2) {
    showToast('需要至少完成 2 轮训练后才能分析薄弱项');
    return;
  }
  const dimTotals = {}; const dimCounts = {};
  for (const d of DIM_NAMES) { dimTotals[d.k] = 0; dimCounts[d.k] = 0; }
  const catTotals = {}; const catCounts = {};
  for (const h of history) {
    for (const d of DIM_NAMES) {
      dimTotals[d.k] += (h.scores[d.k] || 0);
      dimCounts[d.k]++;
    }
    catTotals[h.cat] = (catTotals[h.cat] || 0) + 1;
    catCounts[h.cat] = (catCounts[h.cat] || 0) + 1;
  }
  const dimAvgs = DIM_NAMES.map(d => {
    const avg = dimCounts[d.k] > 0 ? (dimTotals[d.k] / dimCounts[d.k]).toFixed(1) : '—';
    const threshold = THRESHOLDS[d.k];
    return { name: d.n, key: d.k, avg: parseFloat(avg), threshold, pass: parseFloat(avg) >= threshold };
  });
  const weakDims = dimAvgs.filter(d => !d.pass);
  const weakCats = Object.keys(catCounts).sort((a, b) => (catTotals[a] || 0) - (catTotals[b] || 0));
  const bestCat = weakCats.length > 0 ? weakCats[0] : '物流配送';

  let html = `<div style="margin-bottom:8px;font-size:12px;font-weight:600;">📊 综合评分（共 ${history.length} 轮）</div>`;
  for (const d of dimAvgs) {
    const cls = d.pass ? 'pass' : 'fail';
    const label = d.pass ? '✅' : '❌';
    html += `<div class="modal-score-item ${cls}" style="padding:5px 10px;">
      <div><div class="name">${d.name}</div></div>
      <div class="val ${cls}">${d.avg}<span style="font-size:10px;color:#999;">/${d.threshold}</span> ${label}</div>
    </div>`;
  }

  let recHtml;
  if (weakDims.length > 0) {
    const weakNames = weakDims.map(d => d.name + '(' + d.avg.toFixed(1) + '分)').join('、');
    recHtml = `<div style="padding:10px 12px;background:#fff8e1;border-radius:12px;margin-top:8px;">
      <div style="font-size:12px;font-weight:600;color:#c06c00;margin-bottom:4px;">🎯 薄弱项</div>
      <div style="font-size:11px;color:#8a5700;line-height:1.6;">${weakNames}</div>
      <div style="font-size:11px;color:#8a5700;margin-top:4px;">推荐训练：<strong>${bestCat}</strong> 场景</div>
      <button class="btn-start" style="margin-top:6px;width:100%;padding:8px;font-size:13px;" onclick="closeModal();startSession();">🚀 专项训练</button>
    </div>`;
  } else {
    recHtml = `<div style="padding:10px 12px;background:var(--green2);border-radius:12px;margin-top:8px;">
      <div style="font-size:12px;font-weight:600;color:#1a8a3f;">🎉 所有维度均达标</div>
      <button class="btn-start" style="margin-top:6px;width:100%;padding:8px;background:var(--blue);font-size:13px;" onclick="closeModal();startSession();">🚀 继续训练</button>
    </div>`;
  }

  document.getElementById('modalContainer').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2>🎯 薄弱项分析</h2>
        ${html}
        ${recHtml}
        <div class="modal-actions" style="margin-top:10px;">
          <button class="btn-secondary" onclick="closeModal()" style="flex:1;">关闭</button>
        </div>
      </div>
    </div>`;
}

function genReviewItemsHtml(s) {
  const items = [];
  // 复用 genReview 逻辑
  const all = state.msgs.filter(m => m.role === 'agent').map(m => m.text).join('');
  const hl = [];
  if (/确实让您|理解您/.test(all)) hl.push('情绪词开头到位，接住了客户情绪');
  if (/这事儿换谁|换做是我/.test(all)) hl.push('用了「换谁」句式建立共情');
  if (/帮您申请|帮您争取/.test(all)) hl.push('主动使用「帮您申请」体现服务意识');
  if (/您看行吗|您看成吗|可以吗/.test(all)) hl.push('结尾有引导确认动作');
  if (/运费我们出|我们承担运费/.test(all)) hl.push('主动告知运费承担方，业务信息清晰');
  if (/①|②|③/.test(all)) hl.push('给出了多个方案供客户选择');
  if (/是我们的问题|给您道歉/.test(all)) hl.push('主动承认责任不推诿');
  if (hl.length === 0) hl.push('基础功扎实，可以尝试更多共情表达✨');
  for (const h of hl) items.push(`<div class="modal-review-item good"><span class="label">✅</span> ${h}</div>`);

  // 满意度分析
  const sats = state.satisfactions;
  if (sats && sats.length > 0) {
    const satCounts = { '很满意': 0, '满意': 0, '一般': 0, '不满意': 0 };
    for (const x of sats) if (satCounts[x] !== undefined) satCounts[x]++;
    if (satCounts['不满意'] > 0) items.push(`<div class="modal-review-item improve"><span class="label">🔧</span> 出现 ${satCounts['不满意']} 次「不满意」评价，注意提升共情和解决问题能力</div>`);
    if (satCounts['一般'] > 0) items.push(`<div class="modal-review-item improve"><span class="label">🔧</span> 有 ${satCounts['一般']} 轮评价为「一般」，还有提升空间</div>`);

    if (sats.length >= 3 && satScore / satMax < 0.5) items.push(`<div class="modal-review-item improve"><span class="label">🔧</span> 整体满意度偏低，建议复盘各轮评分较低的维度针对性改进</div>`);

  if (s.userSatisfied < 6) im.push('用户满意项偏低，注意每轮结尾问一句「您看行吗」引导确认');
  if (s.emotionMgmt < 6) im.push('情绪管理项偏低，注意先共情再接方案，不要跳过情绪');
  if (!/(我们的问题|给您道歉)/.test(all)) im.push('注意先承认责任再给方案，不要辩解');
  if (im.length === 0) im.push('整体表现优秀，继续保持！🎉');
  while (im.length > 4) im.pop();
  for (const i of im) items.push(`<div class="modal-review-item improve"><span class="label">🔧</span> ${i}</div>`);
  items.push(`<div class="modal-review-item tip"><span class="label">🏷️</span> ${state.cat} · 共 ${state.round} 回合</div>`);

}

function formatAiReview(text) {
  // 将 AI 的结构化文本转成 HTML
  let html = '';
  const sections = text.split(/\n(?=【)/);
  for (const sec of sections) {
    const trimmed = sec.trim();
    if (!trimmed) continue;
    if (trimmed.startsWith('【总体评价】')) {
      const body = trimmed.replace('【总体评价】', '').trim();
      html += `<div class="modal-review-item good" style="background:var(--blue2);border-left:3px solid var(--blue);"><span class="label">📝</span> ${body}</div>`;
    } else if (trimmed.startsWith('【亮点】')) {
      const body = trimmed.replace('【亮点】', '').trim();
      const lines = body.split('\n').filter(l => l.trim());
      for (const line of lines) {
        html += `<div class="modal-review-item good"><span class="label">✅</span> ${line.replace(/^[\d\-.、\s]+/, '')}</div>`;
      }
    } else if (trimmed.startsWith('【改进点】')) {
      const body = trimmed.replace('【改进点】', '').trim();
      const lines = body.split('\n').filter(l => l.trim());
      for (const line of lines) {
        html += `<div class="modal-review-item improve"><span class="label">🔧</span> ${line.replace(/^[\d\-.、\s]+/, '')}</div>`;
      }
    } else if (trimmed.startsWith('【话术优化建议】')) {
      const body = trimmed.replace('【话术优化建议】', '').trim();
      const tips = body.split('\n').filter(l => l.trim());
      html += `<div style="margin-top:8px;"><div style="font-size:12px;font-weight:600;color:var(--blue);margin-bottom:4px;">💡 话术优化建议</div>`;
      for (const tip of tips) {
        const t = tip.replace(/^[\d\-.、\s]+/, '');
        if (t.includes('→') || t.includes('=>')) {
          const parts = t.split(/[→=]>?/);
          if (parts.length >= 2) {
            html += `<div class="modal-review-item tip" style="background:#fff8e1;border-left:3px solid #ff9500;margin-bottom:6px;">
              <div style="font-size:11px;color:#8a5700;margin-bottom:2px;"><span style="font-weight:600;">原始：</span>${parts[0].trim()}</div>
              <div style="font-size:12px;color:#c06c00;font-weight:500;"><span style="font-weight:600;">优化：</span>${parts.slice(1).join('→').trim()}</div>
            </div>`;
          }
        } else {
          html += `<div class="modal-review-item tip" style="background:#fff8e1;">${t}</div>`;
        }
      }
      html += `</div>`;
    } else {
      html += `<div class="modal-review-item tip">${trimmed}</div>`;
    }
  }
  // 补充场景标签
  html += `<div class="modal-review-item tip"><span class="label">🏷️</span> ${state.cat} · 共 ${state.round} 回合</div>`;
  return html;
}

function buildSatSummary() {
  const sats = state.satisfactions;
  if (!sats || sats.length === 0) return '';
  const counts = { '很满意': 0, '满意': 0, '一般': 0, '不满意': 0 };
  for (const s of sats) if (counts[s] !== undefined) counts[s]++;
  const total = sats.length;
  // 确定总体满意度（取众数，平局取较高者）
  let primary = '一般';
  for (const lv of SAT_LEVELS) {
    if (counts[lv] > (counts[primary] || 0)) primary = lv;
  }
  const pct = Math.round(counts[primary] / total * 100);
  const bars = SAT_LEVELS.map(lv => {
    const w = Math.max(4, Math.round(counts[lv] / total * 100));
    const c = lv === '很满意' ? '#34c759' : lv === '满意' ? '#0071e3' : lv === '一般' ? '#ff9500' : '#ff3b30';
    return `<div style="display:flex;align-items:center;gap:4px;font-size:11px;margin-bottom:2px;">
      <span style="width:48px;text-align:right;color:var(--text2);">${SAT_EMOJIS[lv]} ${lv}</span>
      <div style="flex:1;height:14px;background:#f0f0f0;border-radius:7px;overflow:hidden;">
        <div style="height:100%;width:${w}%;background:${c};border-radius:7px;transition:width 0.5s;"></div>
      </div>
      <span style="width:24px;text-align:left;font-weight:600;color:var(--text);">${counts[lv]}</span>
    </div>`;
  }).join('');
  const emoji = SAT_EMOJIS[primary] || '';
  const color = primary === '很满意' ? '#34c759' : primary === '满意' ? '#0071e3' : primary === '一般' ? '#ff9500' : '#ff3b30';
  return `<div style="margin-bottom:12px;padding:10px 14px;background:#f9f9fb;border-radius:12px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
      <span style="font-size:12px;font-weight:600;">😊 客户满意度</span>
      <span style="font-size:13px;font-weight:700;color:${color};">${emoji} ${primary} ${pct}%</span>
    </div>
    ${bars}
    <div style="font-size:10px;color:var(--text3);margin-top:4px;text-align:right;">共 ${total} 轮评价</div>
  </div>`;
}

  for (const s of state.satisfactions) if (satCounts[s] !== undefined) satCounts[s]++;

【对话记录】
${fullHistory}

【7维最终评分】
${DIM_NAMES.map(d => `${d.n}：${scores[d.k]}分（阈值${THRESHOLDS[d.k]}分）`).join('\n')}

【每轮满意度分布】
${SAT_LEVELS.map(l => `${l}：${satCounts[l]}次`).join(' | ')}

请按以下格式输出复盘，不要多余内容：

【总体评价】一段综合评语（100字以内）

function getHistory() {

  localStorage.setItem('csHistory', JSON.stringify(data));

function saveToHistory(scores) {
  const history = getHistory();
  // 获取每个客服回合的详细评分（按 agent 消息顺序对应 acc 数组）
  const agentMsgs = state.msgs.filter(m => m.role === 'agent');
  const detailScores = agentMsgs.map((m, i) => {
    const entry = {};
    for (const d of DIM_NAMES) {
      entry[d.k] = state.acc[d.k][i] || 0;
    }
    return entry;
  });

  const entry = {
    id: Date.now(),
    date: new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
    scene: state.scene,
    cat: state.cat,
    round: state.round,
    messages: JSON.parse(JSON.stringify(state.msgs)),
    scores: JSON.parse(JSON.stringify(scores)),
    detailScores: detailScores,
    satisfactions: JSON.parse(JSON.stringify(state.satisfactions))
  };
  history.unshift(entry);
  if (history.length > 50) history.length = 50; // 最多保留50条
  saveHistoryData(history);
}

  AI_CONFIG.provider = provider;
  AI_CONFIG.model = model;
  AI_CONFIG.mimoModel = mimoModel;
  saveAiConfig();
  updateAiStatus();
  closeModal();
  if (key) setTimeout(fetchBalance, 500);
}

// 页面加载时更新状态 + 获取余额
document.addEventListener('DOMContentLoaded', function() {
  updateAiStatus();
  if (AI_CONFIG.apiKey) setTimeout(fetchBalance, 1000);
  if (AI_CONFIG.provider === 'mimo' && AI_CONFIG.apiKey) setTimeout(fetchMimoModels, 2000);
});

function showHistory() {
  const history = getHistory();
  let listHtml = '';
  if (history.length === 0) {
    listHtml = '<div class="history-empty">暂无历史记录，完成训练后会自动保存 📝</div>';
  } else {
    for (let i = 0; i < history.length; i++) {
      const h = history[i];
      const allPass = Object.keys(h.scores).every(k => h.scores[k] >= THRESHOLDS[k]);
      listHtml += `
        <div class="history-list-item" onclick="showHistoryDetail(${i})">
          <div class="hli-left">
            <div class="hli-cat">${h.cat} · ${h.date}</div>
            <div class="hli-scene">${h.scene}</div>
            <div class="hli-meta"><span>🔄 ${h.round} 回合</span></div>
          </div>
          <div class="hli-badge ${allPass ? 'pass' : 'fail'}">${allPass ? '✅ 通过' : '❌ 未过'}</div>
        </div>`;
    }
  }

  document.getElementById('modalContainer').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2>📋 历史训练记录</h2>
        <div class="history-header-bar">
          <span style="font-size:13px;color:var(--text2);">共 ${history.length} 条记录</span>
          ${history.length > 0 ? '<button class="btn-clear-history" onclick="clearHistory(event)">清空全部</button>' : ''}
        </div>
        ${listHtml}
        <div class="modal-actions" style="margin-top:12px;">
          <button class="btn-secondary" onclick="closeModal()" style="flex:1;">关闭</button>
        </div>
      </div>
    </div>`;
}

function buildHistorySatSummary(h) {
  const sats = h.satisfactions;
  if (!sats || sats.length === 0) return '';
  const counts = { '很满意': 0, '满意': 0, '一般': 0, '不满意': 0 };
  for (const s of sats) if (counts[s] !== undefined) counts[s]++;
  const total = sats.length;
  let primary = '一般';
  for (const lv of SAT_LEVELS) if (counts[lv] > (counts[primary] || 0)) primary = lv;
  const pct = Math.round(counts[primary] / total * 100);
  const bars = SAT_LEVELS.map(lv => {
    const w = Math.max(4, Math.round(counts[lv] / total * 100));
    const c = lv === '很满意' ? '#34c759' : lv === '满意' ? '#0071e3' : lv === '一般' ? '#ff9500' : '#ff3b30';
    return `<div style="display:flex;align-items:center;gap:4px;font-size:11px;margin-bottom:2px;">
      <span style="width:48px;text-align:right;color:var(--text2);">${SAT_EMOJIS[lv]} ${lv}</span>
      <div style="flex:1;height:14px;background:#f0f0f0;border-radius:7px;overflow:hidden;">
        <div style="height:100%;width:${w}%;background:${c};border-radius:7px;"></div>
      </div>
      <span style="width:24px;text-align:left;font-weight:600;">${counts[lv]}</span>
    </div>`;
  }).join('');
  const emoji = SAT_EMOJIS[primary] || '';
  const color = primary === '很满意' ? '#34c759' : primary === '满意' ? '#0071e3' : primary === '一般' ? '#ff9500' : '#ff3b30';
  return `<div style="margin-bottom:12px;padding:10px 14px;background:#f9f9fb;border-radius:12px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
      <span style="font-size:12px;font-weight:600;">😊 客户满意度</span>
      <span style="font-size:13px;font-weight:700;color:${color};">${emoji} ${primary} ${pct}%</span>
    </div>
    ${bars}
    <div style="font-size:10px;color:var(--text3);margin-top:4px;text-align:right;">共 ${total} 轮评价</div>
  </div>`;
}

function showHistoryDetail(index) {
  const history = getHistory();
  const h = history[index];
  if (!h) return;

  // 评分网格
  const allPass = DIM_NAMES.every(d => (h.scores[d.k] || 0) >= THRESHOLDS[d.k]);
  let scoreHtml = '';
  for (const d of DIM_NAMES) {
    const v = h.scores[d.k] || 0; const t = THRESHOLDS[d.k]; const p = v >= t;
    scoreHtml += `<div class="modal-score-item ${p ? 'pass' : 'fail'}">
      <div><div class="name">${d.n}</div><div class="threshold">阈值 ≥${t}</div></div>
      <div class="val ${p ? 'pass' : 'fail'}">${v}<span style="font-size:11px;font-weight:400;color:#999;">/${t}</span></div>
    </div>`;
  }

  // 对话回放（含评分）
  let chatHtml = '';
  let msgIdx = 0;
  let agentIdx = 0;
  for (const msg of h.messages) {
    if (msg.role === 'customer') {
      chatHtml += `<div class="detail-msg customer"><div class="dm-label">客户</div><div class="dm-bubble">${msg.text}</div></div>`;
    } else {
      let scoreStr = '';
      if (h.detailScores && h.detailScores[agentIdx]) {
        const ds = h.detailScores[agentIdx];
        scoreStr = '<div class="dm-scores">';
        for (const d of DIM_NAMES) {
          const v = ds[d.k] || 0; const t = THRESHOLDS[d.k]; const p = v >= t;
          scoreStr += `<span class="dm-dim ${p ? 'pass' : 'fail'}">${d.n}${v}</span>`;
        }
        scoreStr += '</div>';
      }
      const sat = (h.satisfactions && h.satisfactions[agentIdx]) || '';
      const satEmoji = SAT_EMOJIS[sat] || '';
      const satBadge = sat ? `<span style="font-size:10px;margin-left:4px;font-weight:600;">${satEmoji} ${sat}</span>` : '';
      chatHtml += `<div class="detail-msg agent"><div class="dm-label">我的回复${satBadge}</div><div class="dm-bubble">${msg.text}</div>${scoreStr}</div>`;
      agentIdx++;
    }
    msgIdx++;
  }

  // 从 messages 重建分析（复用 genReview 逻辑）
  const allAgentText = h.messages.filter(m => m.role === 'agent').map(m => m.text).join('');
  const reviewItems = [];
  const hl = [];
  if (/确实让您|理解您/.test(allAgentText)) hl.push('情绪词开头到位，接住了客户情绪');
  if (/这事儿换谁|换做是我/.test(allAgentText)) hl.push('用了「换谁」句式建立共情');
  if (/帮您申请|帮您争取/.test(allAgentText)) hl.push('主动使用「帮您申请」体现服务意识');
  if (/您看行吗|您看成吗|可以吗/.test(allAgentText)) hl.push('结尾有引导确认动作');
  if (/运费我们出|我们承担运费/.test(allAgentText)) hl.push('主动告知运费承担方，业务信息清晰');
  if (/①|②|③/.test(allAgentText)) hl.push('给出了多个方案供客户选择');
  if (/是我们的问题|给您道歉/.test(allAgentText)) hl.push('主动承认责任不推诿');
  if (hl.length === 0) hl.push('基础功扎实，可以尝试更多共情表达✨');
  for (const x of hl) reviewItems.push(`<div class="detail-review-item good"><span class="label">✅</span> ${x}</div>`);

  const im = [];
  if (!/确实让您|理解您/.test(allAgentText)) im.push('开场缺少情绪词，建议用「确实让您[情绪]+了」开头');
  if (!/您看行吗|您看成吗|可以吗/.test(allAgentText)) im.push('结尾缺少引导确认，用户满意项可能不达标');
  if (!/这事儿换谁|换做是我/.test(allAgentText)) im.push('可以增加「换谁/换做是我」句式强化共情');
  if (!/帮您申请|帮您争取/.test(allAgentText)) im.push('建议多用「帮您申请/争取」体现站在客户一边');
  const us = h.scores.userSatisfied || 0;
  if (us < 6) im.push('用户满意项偏低，注意每轮结尾问一句「您看行吗」引导确认');
  const em = h.scores.emotionMgmt || 0;
  if (em < 6) im.push('情绪管理项偏低，注意先共情再接方案，不要跳过情绪');
  if (!/(我们的问题|给您道歉)/.test(allAgentText)) im.push('注意先承认责任再给方案，不要辩解');
  if (im.length === 0) im.push('整体表现优秀，继续保持！🎉');
  while (im.length > 4) im.pop();
  for (const x of im) reviewItems.push(`<div class="detail-review-item improve"><span class="label">🔧</span> ${x}</div>`);
  reviewItems.push(`<div class="detail-review-item tip"><span class="label">🏷️</span> ${h.cat} · 共 ${h.round} 回合</div>`);

  const ref = REFERENCE_BY_CAT[h.cat] || '';

  document.getElementById('modalContainer').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal" style="max-width:560px;">
        <h2>📖 历史详情</h2>
        <div style="font-size:12px;color:var(--text2);margin-bottom:12px;line-height:1.6;">
          <div>📌 场景：${h.scene}</div>
          <div>🏷️ ${h.cat} · 🕐 ${h.date} · 🔄 ${h.round} 回合</div>
        </div>

        <div class="result-badge ${allPass ? 'pass' : 'fail'}" style="margin-bottom:12px;">
          ${allPass ? '✅ 命中好服务' : '❌ 未命中好服务'}
        </div>

        <div class="modal-score-grid">${scoreHtml}</div>

        <!-- 历史满意度 -->
        ${buildHistorySatSummary(h)}

        <h3 style="font-size:13px;font-weight:600;margin-bottom:6px;">💬 对话回放</h3>
        <div class="detail-chat">${chatHtml}</div>

        <h3 style="font-size:13px;font-weight:600;margin-bottom:6px;">📝 复盘总结</h3>
        <div class="detail-review">${reviewItems.join('')}</div>
        ${ref ? `<div class="detail-ref"><div class="ref-label">💡 ${h.cat}场景参考话术</div>${ref}</div>` : ''}

        <div class="modal-actions" style="margin-top:16px;">
          <button class="btn-secondary" onclick="showHistory()" style="flex:1;">返回列表</button>
          <button class="btn-primary" onclick="closeModal()" style="flex:1;">关闭</button>
        </div>
      </div>
    </div>`;
}

function clearHistory(e) {
  if (e) e.stopPropagation();
  if (!confirm('确定清空所有历史记录吗？此操作不可恢复。')) return;
  saveHistoryData([]);
  showHistory();
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    const a = document.activeElement;
    if (a && a.id === 'agentInput' && !document.getElementById('btnSend').disabled) { e.preventDefault(); sendReply(); }
  }
  if (e.key === 'Escape') closeModal();
});
</script>
